version: 2
updates:
  # Les actions GitHub sont épinglées par empreinte de commit : Dependabot les met à jour.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # À ajouter avec le code du lot 001 (le dossier doit exister pour que Dependabot fonctionne) :
  # - package-ecosystem: pip        directory: /backend
  # - package-ecosystem: npm        directory: /frontend
  # - package-ecosystem: docker     directory: /
