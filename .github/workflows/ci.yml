name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Droits minimaux par défaut ; chaque job ne demande que ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action liste les commits de la PR via l'API : lecture des PR nécessaire.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Point de passage unique à exiger dans la protection de branche.
  # Les jobs backend et frontend s'ajoutent à `needs` quand le code arrive.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le résultat des jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Au moins un job a échoué ou a été annulé."
            exit 1
          fi
