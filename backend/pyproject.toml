[project]
name = "finance"
version = "0.1.0"
description = "Suivi de patrimoine auto-hébergé (PEE, PEA, CTO, assurance-vie, Livret A)"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "pydantic>=2.8",
    "sqlcipher3-wheels==0.5.7",
    "httpx>=0.27",
    "yfinance==1.7.0",
    "charset-normalizer>=3.3",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert est le style normal des tests
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["finance"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Mode strict sur le domaine : fonctions pures, aucun accès base ni réseau (plan.md)
[[tool.mypy.overrides]]
module = "finance.domain.*"
strict = true
