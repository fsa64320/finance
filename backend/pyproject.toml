[project]
name = "finance"
version = "0.1.0"
description = "Suivi de patrimoine auto-hébergé (PEE, PEA, CTO, assurance-vie, Livret A)"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "pydantic>=2.14.1",
    "sqlcipher3-wheels==0.5.7",
    "httpx>=0.28.1",
    "yfinance==1.7.0",
    "charset-normalizer>=3.5.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.170.5",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=2.4.0",
    "pyyaml>=6",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Les dépendances FastAPI s'écrivent en valeurs par défaut des paramètres.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# assert est le style normal des tests
"tests/**" = ["S101"]
# Migrations : SQL construit sur une liste figée de tables, lignes longues générées par Alembic
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["finance"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Mode strict sur le domaine : fonctions pures, aucun accès base ni réseau (plan.md)
[[tool.mypy.overrides]]
module = "finance.domain.*"
strict = true
